<!--
  Syntaxe Angular dans ce fichier (à retenir) :
  - [propriété]="valeur"  → on ENVOIE une valeur du TS vers le HTML
  - (événement)="action"  → on RÉAGIT à un clic, un changement, etc.
  - {{ expression }}      → on AFFICHE du texte
  - @if (condition) { }   → afficher un bloc seulement si c'est vrai
  - routerLink="/home"    → changer d'URL SANS recharger toute la page
-->
<mat-sidenav-container class="shell">

  <!-- Menu de gauche -->
  <mat-sidenav
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="sidenavOpen()"
    (click)="onNavNavigate()"
    class="shell-nav"
  >
    <mat-nav-list>
      <a mat-list-item routerLink="/home">
        <mat-icon iconPositionEnd>home</mat-icon>
        <span>Accueil</span>
      </a>

      <!-- "as u" = on range l'utilisateur dans une variable locale u -->
      @if (user(); as u) {
        <a mat-list-item routerLink="/home">
          <mat-icon iconPositionEnd>badge</mat-icon>
          <span>{{ u.fullName }}</span>
        </a>
      }

      <!-- Le lien admin est caché, MAIS la vraie sécurité est côté Java. -->
      @if (isAdmin()) {
        <a mat-list-item routerLink="/users">
          <mat-icon iconPositionEnd>group</mat-icon>
          <span>Utilisateurs</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar color="primary" class="shell-toolbar">
      <button
        mat-icon-button
        aria-label="Basculer le menu latéral"
        (click)="sidenavOpen.set(!sidenavOpen())"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <span class="shell-title">Enterprise</span>
      <span class="spacer"></span>

      <button
        mat-icon-button
        (click)="toggleDarkMode()"
        [matTooltip]="darkMode() ? 'Thème clair' : 'Thème sombre'"
        aria-label="Basculer le thème clair/sombre"
      >
        <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      @if (user(); as u) {
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-chip">
          <mat-icon>account_circle</mat-icon>
          {{ u.fullName }}
        </button>
        <!-- #userMenu = un "nom local" pour relier le bouton au menu -->
        <mat-menu #userMenu="matMenu">
          <div mat-menu-content class="user-menu-header">
            <strong>{{ u.email }}</strong>
            <small>{{ u.roles.join(', ') }}</small>
          </div>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Déconnexion</span>
          </button>
        </mat-menu>
      } @else {
        <a mat-button routerLink="/login">Connexion</a>
        <a mat-button routerLink="/register">Inscription</a>
      }
    </mat-toolbar>

    <!-- ICI Angular affiche Home, Login, Users... selon l'URL. -->
    <main class="page">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
