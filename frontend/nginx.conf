# =====================================================================
# NGINX pour le frontend Angular (conteneur).
#
# Deux rôles :
#  1. servir les fichiers statiques de l'application (HTML/JS/CSS) ;
#  2. proxyfier /api/** vers le backend Spring Boot : le navigateur ne
#     parle qu'à UNE seule origine (pas de CORS en production).
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression (bonus perf) -------------------------------------
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- Fichiers statiques --------------------------------------------
    location / {
        # Fallback SPA : toute URL inconnue renvoie index.html pour que le
        # routeur Angular (/login, /users...) prenne le relais.
        try_files $uri $uri/ /index.html;
    }

    # Les bundles JS/CSS sont fingerprintés (=hash) : cache long safe.
    location ~* \.(js|css|woff2|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Proxy vers le backend ------------------------------------------
    # "backend" = nom du service dans docker-compose.yml (réseau interne).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le healthcheck Docker du backend reste accessible si besoin (debug).
    location /actuator/health {
        proxy_pass http://backend:8080;
        access_log off;
    }
}
