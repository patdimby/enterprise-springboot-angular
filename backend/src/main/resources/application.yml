spring:
  application:
    name: enterprise-backend
  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:enterprise}
    password: ${MYSQL_PASSWORD:enterprise}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

server:
  port: 8080
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt-secret: ${APP_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0yNTZiaXRzIQ==}
  jwt-expiration: 24h
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.enterprise.app: DEBUG
